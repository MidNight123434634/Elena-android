name: Armar la APK de Elena
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      # Modelo pequeño de reconocimiento de voz (para la palabra «Elena»), dentro de la app
      - name: Descargar el modelo de voz
        run: |
          curl -sSL -o modelo.zip https://alphacephei.com/vosk/models/vosk-model-small-es-0.42.zip
          unzip -q modelo.zip
          rm -rf app/src/main/assets/model-es
          mv vosk-model-small-es-0.42 app/src/main/assets/model-es
          echo "vosk-small-es-0.42" > app/src/main/assets/model-es/uuid
      - run: node tests/microfono-web.test.cjs
      - run: gradle :app:assembleDebug --no-daemon -PversionCode=${{ github.run_number }}
      - run: cp app/build/outputs/apk/debug/app-debug.apk Jarvis.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Elena-apk
          path: Jarvis.apk
      # La APK queda también en la rama "apk" del repositorio
      - name: Guardar la APK en la rama apk
        run: |
          mkdir /tmp/salida && cp Jarvis.apk /tmp/salida/
          echo '{"version": ${{ github.run_number }}}' > /tmp/salida/Jarvis_version.json
          cd /tmp/salida
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add Jarvis.apk Jarvis_version.json
          git commit -q -m "APK de ${GITHUB_SHA::7}"
          git -c http.postBuffer=524288000 push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" apk
      # Y como versión descargable en la página del repositorio (pestaña Releases)
      - name: Publicar la versión
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima Jarvis.apk --title "Elena para Android" --notes "Última versión de la app de Elena. Descarga Jarvis.apk en el teléfono e instálala."
