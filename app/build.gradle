plugins {
    id "com.android.application"
}

android {
    namespace "cl.jarvis.app"
    compileSdk 34

    defaultConfig {
        applicationId "cl.jarvis.app"
        minSdk 24
        targetSdk 34
        // El número de versión lo pone GitHub en cada armado: así la app sabe cuándo hay una nueva
        versionCode((project.findProperty("versionCode") ?: "1").toString().toInteger())
        versionName "1." + (project.findProperty("versionCode") ?: "1")
    }

    // Siempre la misma firma: Android solo deja actualizar una app si la versión nueva viene firmada igual
    signingConfigs {
        jarvis {
            storeFile file("jarvis.keystore")
            storePassword "abwQr3KdZ-vFkuV4u8kyHkvI"
            keyAlias "jarvis"
            keyPassword "abwQr3KdZ-vFkuV4u8kyHkvI"
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.jarvis }
        release { signingConfig signingConfigs.jarvis }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.11.0"
}
